<svg viewBox="0 0 980 900" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b7fa6"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a97b0a"/>
    </marker>
  </defs>

  <rect width="980" height="900" fill="#f4f7fb"/>

  <!-- Title -->
  <text x="490" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#012652">Winback — System Architecture</text>
  <text x="490" y="60" text-anchor="middle" font-size="12" fill="#5b7fa6">React dashboard → Express API → decision engine → live ML call, with a rules-only fallback</text>

  <!-- ===== Client layer ===== -->
  <rect x="60" y="90" width="860" height="120" rx="14" fill="#ffffff" stroke="#d7e3f0" stroke-width="1.5"/>
  <text x="80" y="115" font-size="13" font-weight="700" fill="#012652">CLIENT — React (Vite)</text>

  <g font-size="11" fill="#012652">
    <rect x="80" y="130" width="130" height="60" rx="8" fill="#eef4fb" stroke="#0D94FB"/>
    <text x="145" y="155" text-anchor="middle" font-weight="700">Overview</text>
    <text x="145" y="170" text-anchor="middle" fill="#5b7fa6" font-size="9.5">Recovered ₹, lift %</text>

    <rect x="225" y="130" width="130" height="60" rx="8" fill="#eef4fb" stroke="#0D94FB"/>
    <text x="290" y="155" text-anchor="middle" font-weight="700">Transactions</text>
    <text x="290" y="170" text-anchor="middle" fill="#5b7fa6" font-size="9.5">filter, approve/reject</text>

    <rect x="370" y="130" width="130" height="60" rx="8" fill="#eef4fb" stroke="#0D94FB"/>
    <text x="435" y="155" text-anchor="middle" font-weight="700">Audit Log</text>
    <text x="435" y="170" text-anchor="middle" fill="#5b7fa6" font-size="9.5">every decision, reasoning</text>

    <rect x="515" y="130" width="180" height="60" rx="8" fill="#fff4d6" stroke="#e0a800"/>
    <text x="605" y="155" text-anchor="middle" font-weight="700">Live Demo Checkout</text>
    <text x="605" y="170" text-anchor="middle" fill="#8a6300" font-size="9.5">creates a real transaction</text>

    <rect x="710" y="130" width="180" height="60" rx="8" fill="#0b1120"/>
    <text x="800" y="155" text-anchor="middle" font-weight="700" fill="#3ddc84">Live Console</text>
    <text x="800" y="170" text-anchor="middle" fill="#7c92ad" font-size="9.5">polls /audit, tails decisions</text>
  </g>

  <line x1="490" y1="210" x2="490" y2="245" stroke="#5b7fa6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="232" font-size="10" fill="#5b7fa6">HTTP (fetch)</text>

  <!-- ===== Express API ===== -->
  <rect x="60" y="250" width="860" height="90" rx="14" fill="#ffffff" stroke="#d7e3f0" stroke-width="1.5"/>
  <text x="80" y="273" font-size="13" font-weight="700" fill="#012652">BACKEND — Node.js + Express</text>
  <text x="80" y="295" font-size="11" fill="#5b7fa6">/api/summary  /api/transactions  /api/audit  /api/agent/run  /api/agent/review/:id  /api/agent/message/:id  /api/demo/simulate</text>
  <text x="80" y="315" font-size="10" fill="#7c92ad">Prisma ORM ↔ SQLite  ·  every decision also prints live to this process's terminal (agent@winback console)</text>

  <line x1="490" y1="340" x2="490" y2="375" stroke="#5b7fa6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Decision Engine ===== -->
  <rect x="60" y="380" width="860" height="140" rx="14" fill="#012652"/>
  <text x="80" y="405" font-size="13" font-weight="700" fill="#ffffff">DECISION ENGINE — decisionEngine.js</text>

  <g>
    <rect x="90" y="420" width="220" height="80" rx="10" fill="#0D94FB"/>
    <text x="200" y="445" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1. Rules Score</text>
    <text x="200" y="463" text-anchor="middle" font-size="9.5" fill="#eaf5ff">failure-reason base rate</text>
    <text x="200" y="477" text-anchor="middle" font-size="9.5" fill="#eaf5ff">× customer reliability</text>

    <text x="345" y="465" text-anchor="middle" font-size="20" fill="#ffffff">+</text>

    <rect x="380" y="420" width="220" height="80" rx="10" fill="#e8b923"/>
    <text x="490" y="445" text-anchor="middle" font-size="12" font-weight="700" fill="#012652">2. ML Score</text>
    <text x="490" y="463" text-anchor="middle" font-size="9.5" fill="#4a3a06">live call to Python service</text>
    <text x="490" y="477" text-anchor="middle" font-size="9.5" fill="#4a3a06">400ms timeout</text>

    <text x="635" y="465" text-anchor="middle" font-size="20" fill="#ffffff">=</text>

    <rect x="670" y="420" width="220" height="80" rx="10" fill="#ffffff"/>
    <text x="780" y="445" text-anchor="middle" font-size="12" font-weight="700" fill="#012652">3. Blended Score</text>
    <text x="780" y="463" text-anchor="middle" font-size="9.5" fill="#5b7fa6">→ action + cost-aware</text>
    <text x="780" y="477" text-anchor="middle" font-size="9.5" fill="#5b7fa6">override check</text>
  </g>

  <!-- ML service branch -->
  <line x1="490" y1="500" x2="490" y2="530" stroke="#e0a800" stroke-width="2" marker-end="url(#arrowGold)"/>
  <text x="505" y="522" font-size="10" fill="#8a6300">POST /predict</text>

  <rect x="330" y="535" width="320" height="90" rx="14" fill="#fff4d6" stroke="#e0a800" stroke-width="1.5"/>
  <text x="490" y="560" text-anchor="middle" font-size="13" font-weight="700" fill="#8a6300">ML MICROSERVICE — Python / FastAPI</text>
  <text x="490" y="580" text-anchor="middle" font-size="10" fill="#4a3a06">Calibrated gradient boosting classifier</text>
  <text x="490" y="596" text-anchor="middle" font-size="10" fill="#4a3a06">trained on this project's own transaction history</text>
  <text x="490" y="612" text-anchor="middle" font-size="9.5" font-style="italic" fill="#a97b0a">unreachable → falls back to rules-only, never crashes</text>

  <line x1="490" y1="625" x2="490" y2="655" stroke="#5b7fa6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Execution / Outcome ===== -->
  <rect x="60" y="660" width="860" height="90" rx="14" fill="#ffffff" stroke="#d7e3f0" stroke-width="1.5"/>
  <text x="80" y="683" font-size="13" font-weight="700" fill="#012652">EXECUTION — outcomeSimulator.js</text>
  <text x="80" y="705" font-size="11" fill="#5b7fa6">Simulates the chosen action's result using the blended probability. Updates Transaction status + retryCount.</text>
  <text x="80" y="722" font-size="11" fill="#5b7fa6">Writes a full AgentAction row: rule score, ML score, blended score, scoring method, reasoning.</text>

  <line x1="490" y1="750" x2="490" y2="780" stroke="#5b7fa6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Data + control group ===== -->
  <rect x="60" y="785" width="410" height="90" rx="14" fill="#ffffff" stroke="#d7e3f0" stroke-width="1.5"/>
  <text x="80" y="808" font-size="13" font-weight="700" fill="#012652">DATA — SQLite (via Prisma)</text>
  <text x="80" y="828" font-size="10.5" fill="#5b7fa6">Customer · Transaction · PaymentAttempt · AgentAction</text>
  <text x="80" y="846" font-size="10.5" fill="#5b7fa6">Source of truth for every dashboard view — one DB, three tabs, all consistent.</text>

  <rect x="510" y="785" width="410" height="90" rx="14" fill="#f4f4f4" stroke="#c7c7c7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="530" y="808" font-size="13" font-weight="700" fill="#555">CONTROL GROUP — bypasses the agent entirely</text>
  <text x="530" y="828" font-size="10.5" fill="#777">A held-out slice of transactions the agent never touches.</text>
  <text x="530" y="846" font-size="10.5" fill="#777">Its organic recovery rate is the baseline "lift" is measured against.</text>
</svg>